# مشروع Xcode يُولَّد بـ XcodeGen (brew install xcodegen && xcodegen generate) — لا يُلتزَم ملف .xcodeproj
name: Sakinah
options:
  bundleIdPrefix: org.emdatra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
packages:
  SakinahCore:
    path: ".."
settings:
  base:
    DEVELOPMENT_TEAM: Y4R9ZHWK9Y
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Sakinah:
    type: application
    platform: iOS
    sources:
      - path: Sakinah
      # صوت الإشعار (≤ 30 ثانية) والأذان الكامل — الملفات نفسها في نسخة الويب (LICENSE في sakinah/assets/audio)
      - path: ../../sakinah/assets/audio/adhan_short.wav
        buildPhase: resources
      - path: ../../sakinah/assets/audio/adhan-fakhry.mp3
        buildPhase: resources
      - path: ../../sakinah/assets/audio/adhan-azeez.mp3
        buildPhase: resources
      # خطوط صفحات المصحف الـ604 وأسماء السور وأميري قرآن (TTF مضغوطة) — تُولَّد بـ tools/build-fonts.py قبل توليد المشروع
      - path: Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SakinahCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.emdatra.sakinah.native
        PRODUCT_NAME: Sakinah
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # التوقيع اليدوي على هدف التطبيق وحده (تمريره على سطر أوامر xcodebuild يصيب حزمة موارد SakinahCore التي لا تقبل ملف provisioning)
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Sakinah Native AppStore CI"
    info:
      path: Sakinah/Info.plist
      properties:
        CFBundleDisplayName: "سكينة"
        CFBundleName: "Sakinah"
        # الإصدار ورقم البناء من إعدادات البناء (XcodeGen يكتب 1.0/1 حرفيًا إن لم تُذكر)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "لحساب مواقيت الصلاة واتجاه القبلة حسب موقعك"
        NSMotionUsageDescription: "لتشغيل بوصلة القبلة"
        NSMicrophoneUsageDescription: "لسماع تلاوتك في مراجعة الحفظ وكشف الكلمات المطابقة"
        NSSpeechRecognitionUsageDescription: "لتحويل تلاوتك إلى كلمات ومطابقتها مع نص الآيات في مراجعة الحفظ"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  Sakinah:
    build:
      targets:
        Sakinah: all
    run:
      config: Debug
    archive:
      config: Release
