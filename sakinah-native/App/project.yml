# مشروع Xcode يُولَّد بـ XcodeGen (brew install xcodegen && xcodegen generate) — لا يُلتزَم ملف .xcodeproj
name: Sakinah
options:
  bundleIdPrefix: org.emdatra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
packages:
  SakinahCore:
    path: ".."
settings:
  base:
    DEVELOPMENT_TEAM: Y4R9ZHWK9Y
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Sakinah:
    type: application
    platform: iOS
    sources:
      - path: Sakinah
    dependencies:
      - package: SakinahCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.emdatra.sakinah.native
        PRODUCT_NAME: Sakinah
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sakinah/Info.plist
      properties:
        CFBundleDisplayName: "سكينة"
        CFBundleName: "Sakinah"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "لحساب مواقيت الصلاة واتجاه القبلة حسب موقعك"
        NSMotionUsageDescription: "لتشغيل بوصلة القبلة"
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  Sakinah:
    build:
      targets:
        Sakinah: all
    run:
      config: Debug
    archive:
      config: Release
