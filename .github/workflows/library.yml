name: library

# The media library lives in library/; Media Pro (PHP, repo root) is not touched by this workflow.
on:
  push:
    branches: [main]
    paths: ['library/**', '.github/workflows/library.yml']
  pull_request:
    paths: ['library/**', '.github/workflows/library.yml']

permissions:
  contents: read

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: library

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: media, POSTGRES_PASSWORD: media, POSTGRES_DB: media_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U media" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://media:media@127.0.0.1:5432/media_test
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: Asia/Hebron
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: library/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: library/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # S3-compatible stand-in for R2 (MinIO's downloads are unreliable in CI); the bucket gets R2's CORS policy in global-setup
      - name: Start S3 test server (moto)
        run: |
          python3 -m pip install --quiet "moto[server]==5.1.20"
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done
      - run: pnpm test:e2e
      # M3 acceptance: a 2 GiB file, network cut and tab closed mid-way, resumed, size verified
      - run: pnpm exec playwright test upload.spec -g "survives"
        env: { E2E_BIG_UPLOAD: '1' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: library/test-results, retention-days: 7 }
