name: library

# The media library lives in library/; Media Pro (PHP, repo root) is not touched by this workflow.
on:
  push:
    branches: [main]
    paths: ['library/**', '.github/workflows/library.yml']
  pull_request:
    paths: ['library/**', '.github/workflows/library.yml']

permissions:
  contents: read

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: library

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: media, POSTGRES_PASSWORD: media, POSTGRES_DB: media_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U media" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://media:media@127.0.0.1:5432/media_test
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: Asia/Hebron
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: library/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: library/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      # the processing worker's tools (the worker image carries the same — docs/processing.md)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg libimage-exiftool-perl libraw-bin libheif-examples libheif-plugin-libde265 fonts-dejavu-core
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # S3-compatible stand-in for R2 (MinIO's downloads are unreliable in CI); the bucket gets R2's CORS policy in global-setup
      - name: Start S3 test server (moto)
        run: |
          python3 -m pip install --quiet "moto[server]==5.1.20"
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done
      - run: pnpm test:e2e
      # M3 acceptance: a 2 GiB file, network cut and tab closed mid-way, resumed, size verified
      - run: pnpm exec playwright test upload.spec -g "survives"
        env: { E2E_BIG_UPLOAD: '1' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: library/test-results, retention-days: 7 }

  # The two production images build from the same Dockerfile the server uses (library/deploy/vps); the worker
  # image refuses to build without ffmpeg's libx264 and libsvtav1. Then the image's own bundles migrate an empty
  # database and the worker starts against it — the first minutes of the server, rehearsed. Nothing is pushed.
  images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: media, POSTGRES_PASSWORD: media, POSTGRES_DB: media }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U media" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: docker build -f deploy/vps/Dockerfile --target app -t media-app:ci .
      - name: Build the worker image
        run: docker build -f deploy/vps/Dockerfile --target worker -t media-worker:ci .
      - name: The worker image carries its tools, bundles and migrations
        run: docker run --rm media-worker:ci sh -c 'exiftool -ver >/dev/null && command -v dcraw_emu && test -f ops/worker.mjs && test -f drizzle/meta/_journal.json && test -f deploy/vps/r2-cors.json'
      - name: The worker image decodes an iPhone HEIC (HEVC) — sharp alone cannot
        run: |
          docker run --rm -v "$PWD/tests/fixtures:/fx:ro" media-worker:ci sh -c 'heif-convert -q 90 /fx/iphone.heic /tmp/o.jpg >/dev/null && test -s /tmp/o.jpg' \
            || { echo "heif-convert in the worker image cannot decode HEVC"; exit 1; }
      - name: Migrate an empty database with the image, then start the worker against it
        run: |
          DB=postgres://media:media@127.0.0.1:5432/media
          docker run --rm --network host -e DATABASE_URL=$DB media-worker:ci node ops/migrate.mjs
          docker run -d --name media-worker-ci --network host -e DATABASE_URL=$DB -e S3_ENDPOINT=http://127.0.0.1:9 -e S3_BUCKET=x \
            -e S3_ACCESS_KEY_ID=x -e S3_SECRET_ACCESS_KEY=x -e SESSION_SECRET=ci-only-not-a-secret-0000000000000000 media-worker:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3191/ && break; sleep 1; done
          curl -sf http://127.0.0.1:3191/ || { docker logs media-worker-ci; exit 1; }
          docker logs media-worker-ci 2>&1 | grep -q "looking for jobs" || { docker logs media-worker-ci; exit 1; }
      - name: The app image serves /api/health from the same database
        run: |
          docker run -d --name media-app-ci --network host -e DATABASE_URL=postgres://media:media@127.0.0.1:5432/media -e PORT=3300 \
            -e SESSION_SECRET=ci-only-not-a-secret-0000000000000000 -e LINK_SIGNING_SECRET=ci-only-not-a-secret-1111111111111111 \
            -e APP_ORIGIN=http://127.0.0.1:3300 -e S3_ENDPOINT=http://127.0.0.1:9 -e S3_BUCKET=x -e S3_ACCESS_KEY_ID=x -e S3_SECRET_ACCESS_KEY=x media-app:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3300/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3300/api/health | grep -q '"ok":true' || { docker logs media-app-ci; exit 1; }
