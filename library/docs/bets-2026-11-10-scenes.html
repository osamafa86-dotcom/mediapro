<body>

<title>ثمانية مشاهد من المكتبة</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one scene at a time, picked from a numbered rail. Each scene is the product itself in miniature (left:
   the screen the person uses; right: what happens behind it, step by step). Quiet neutral shell, one teal accent;
   the mock media and the state colours (yours / shared / held / refused) are the only colour. */
:root {
  --bg: #fafafa; --surface: #ffffff; --subtle: #f2f2f2; --line: rgb(0 0 0 / .10);
  --fg: #0a0a0a; --fg2: #404040; --fg3: #636363;
  --accent: #04827e; --accent-fg: #ffffff; --accent-soft: #e6fbfa; --accent-text: #05605d;
  --ok: #15803d; --ok-soft: #f0fdf4; --bad: #b91c1c; --bad-soft: #fef2f2; --warn: #b45309; --warn-soft: #fffbeb;
  --b: #4338ca; --b-soft: #eef2ff;
  --sans: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0a0a; --surface: #171717; --subtle: #202020; --line: rgb(255 255 255 / .12);
  --fg: #f5f5f5; --fg2: #b4b4b4; --fg3: #8f8f8f;
  --accent: #1fc9c2; --accent-fg: #0a0a0a; --accent-soft: #062e2d; --accent-text: #1fc9c2;
  --ok: #86efac; --ok-soft: #062c16; --bad: #fca5a5; --bad-soft: #3b0d0d; --warn: #fcd34d; --warn-soft: #3a2504;
  --b: #a5b4fc; --b-soft: #1e1b4b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0a0a; --surface: #171717; --subtle: #202020; --line: rgb(255 255 255 / .12);
  --fg: #f5f5f5; --fg2: #b4b4b4; --fg3: #8f8f8f;
  --accent: #1fc9c2; --accent-fg: #0a0a0a; --accent-soft: #062e2d; --accent-text: #1fc9c2;
  --ok: #86efac; --ok-soft: #062c16; --bad: #fca5a5; --bad-soft: #3b0d0d; --warn: #fcd34d; --warn-soft: #3a2504;
  --b: #a5b4fc; --b-soft: #1e1b4b; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.7; }
.wrap { max-inline-size: 1120px; margin-inline: auto; padding-block: 24px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3, h4, p, ol, ul, pre { margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); line-height: 1.3; font-weight: 600; text-wrap: balance; }
h2 { font-size: clamp(1.3rem, 2.6vw, 1.7rem); line-height: 1.4; font-weight: 600; text-wrap: balance; }
h4 { font-size: .9rem; font-weight: 600; }
p, li { color: var(--fg2); } strong { color: var(--fg); font-weight: 600; }
.lead { font-size: 1.05rem; max-inline-size: 66ch; }
.small { font-size: .82rem; color: var(--fg3); line-height: 1.6; }
.mono { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; font-size: .85em; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.rail { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.rail button { border: 0; border-inline-start: 1px solid var(--line); background: transparent; padding: 10px 10px 12px; text-align: start; display: flex; flex-direction: column; gap: 1px; min-inline-size: 0; }
.rail button:first-child { border-inline-start: 0; }
.rail small { font-size: .7rem; color: var(--fg3); } .rail span { font-size: .86rem; font-weight: 500; line-height: 1.4; color: var(--fg2); }
.rail button[aria-current="true"] { background: var(--accent-soft); } .rail button[aria-current="true"] span { color: var(--accent-text); font-weight: 600; }
@media (max-width: 900px) { .rail { grid-template-columns: repeat(4, minmax(0, 1fr)); } .rail button:nth-child(5) { border-inline-start: 0; } .rail button:nth-child(n+5) { border-block-start: 1px solid var(--line); } }
@media (max-width: 520px) { .rail { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rail button { border-block-start: 1px solid var(--line); } .rail button:nth-child(odd) { border-inline-start: 0; } .rail button:nth-child(-n+2) { border-block-start: 0; } }

.scene { display: flex; flex-direction: column; gap: 16px; }
.scene > header { display: flex; flex-direction: column; gap: 6px; max-inline-size: 70ch; }
.verb { font-size: .78rem; color: var(--accent-text); font-weight: 500; }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stage, .behind { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-inline-size: 0; }
.behind ol { padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; font-size: .92rem; line-height: 1.65; }
.behind li.on { color: var(--fg); } .behind li.on::marker { color: var(--accent-text); font-weight: 600; }
.fact { font-size: .86rem; background: var(--subtle); border-radius: var(--r-sm); padding: 8px 10px; line-height: 1.6; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.between { justify-content: space-between; }
.panel { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-inline-size: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 14px; font-size: .88rem; min-block-size: 36px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 500; }
.btn[disabled] { opacity: .45; cursor: default; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--subtle); border-radius: 8px; padding: 3px; gap: 2px; }
.stage > .seg { align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 6px; font-size: .85rem; color: var(--fg2); min-block-size: 32px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
.pill { font-size: .76rem; padding: 2px 9px; border-radius: 99px; background: var(--subtle); color: var(--fg2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.acc { background: var(--accent-soft); color: var(--accent-text); } .pill.b { background: var(--b-soft); color: var(--b); }
.msg { font-size: .9rem; border-radius: var(--r-sm); padding: 8px 12px; line-height: 1.6; } .msg.ok { background: var(--ok-soft); color: var(--ok); } .msg.bad { background: var(--bad-soft); color: var(--bad); } .msg.info { background: var(--subtle); color: var(--fg2); }

/* mock media */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.ph { position: relative; border-radius: var(--r-sm); overflow: hidden; aspect-ratio: 4 / 3; color: #fff; min-inline-size: 0; border: 0; padding: 0; display: block; inline-size: 100%; }
.ph .l { position: absolute; inset-inline-start: 5px; inset-block-end: 3px; font-size: .64rem; text-shadow: 0 1px 2px rgb(0 0 0 / .7); line-height: 1.5; }
.ph .n { position: absolute; inset-inline-end: 4px; inset-block-start: 4px; font-size: .62rem; background: rgb(0 0 0 / .6); border-radius: 99px; padding: 0 6px; line-height: 1.7; }
.ph.clip::before { content: ''; position: absolute; inset-inline-start: 6px; inset-block-start: 6px; border-style: solid; border-width: 5px 0 5px 8px; border-color: transparent transparent transparent #fff; filter: drop-shadow(0 1px 1px rgb(0 0 0 / .6)); }
.s1 { background: radial-gradient(60% 70% at 30% 35%, #f6c177 0, transparent 60%), linear-gradient(160deg, #c2410c, #7c2d12 60%, #431407); }
.s2 { background: radial-gradient(50% 60% at 70% 30%, #7dd3fc 0, transparent 65%), linear-gradient(170deg, #0369a1, #075985 55%, #3f3a2d); }
.s3 { background: radial-gradient(55% 55% at 45% 60%, #fde68a 0, transparent 60%), linear-gradient(150deg, #a16207, #713f12 60%, #292524); }
.s4 { background: radial-gradient(50% 70% at 60% 40%, #86efac 0, transparent 60%), linear-gradient(165deg, #3f6212, #365314 55%, #1c1917); }
.s5 { background: radial-gradient(60% 60% at 35% 45%, #fda4af 0, transparent 60%), linear-gradient(155deg, #9f1239, #6b213a 60%, #27141c); }
.s6 { background: radial-gradient(55% 65% at 55% 35%, #c4b5fd 0, transparent 60%), linear-gradient(160deg, #5b21b6, #3b1a78 60%, #18122b); }
.ph.local { background: var(--subtle); outline: 1px dashed var(--line); outline-offset: -1px; }
.ph .im { position: absolute; inset: -6px; display: block; } .im.ghost { filter: blur(5px) saturate(.55); } .im.sample { filter: blur(1.6px); }
.ph .l, .ph .n, .ph.clip::before { z-index: 1; } .ph.local .l { color: var(--fg3); text-shadow: none; } .ph.local.clip::before { border-color: transparent transparent transparent var(--fg3); filter: none; }
.mk-a { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); } .mk-b { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--b); }
.mk-h { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--warn); } .dim { opacity: .2; }
.bn { position: absolute; inset-inline: 18%; inset-block-start: 12%; block-size: 42%; background: #fafafa; border-radius: 1px; }
.bn::after { content: ''; position: absolute; inset-inline: 32%; inset-block-start: 45%; block-size: 2px; background: #8a8a8a; }
.bn i { position: absolute; inline-size: 22%; aspect-ratio: 1; background: #111; display: block; }
.bn i:first-child { inset-block-start: 9%; inset-inline-start: 5%; } .bn i:last-child { inset-block-end: 9%; inset-inline-end: 5%; }
.bn.read i { background: var(--accent); }
.meter { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) 6rem; gap: 8px; align-items: center; font-size: .82rem; }
.meter .track { block-size: 10px; background: var(--subtle); border-radius: 99px; overflow: hidden; } .meter .fill { block-size: 100%; background: var(--fg3); border-radius: 99px; transition: inline-size .4s ease; }
.meter .fill.acc { background: var(--accent); } .meter b { font-variant-numeric: tabular-nums; font-weight: 500; text-align: left; direction: ltr; unicode-bidi: isolate; }
@media (max-width: 520px) { .meter { grid-template-columns: minmax(0, 1fr) 5.5rem; } .meter .track { grid-column: 1 / -1; grid-row: 2; } }
table { border-collapse: collapse; inline-size: 100%; font-size: .86rem; } th, td { text-align: start; padding: 7px 8px; border-block-end: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 500; color: var(--fg3); font-size: .76rem; } .tw { overflow-x: auto; } tr.pick td { background: var(--accent-soft); }
td .ph { inline-size: 44px; }
pre.code { font-family: var(--mono); direction: ltr; text-align: left; font-size: .74rem; line-height: 1.55; background: var(--subtle); border-radius: var(--r-sm); padding: 10px 12px; overflow-x: auto; color: var(--fg2); }
pre.code b { color: var(--accent-text); font-weight: 500; }
.player { position: relative; aspect-ratio: 9 / 16; inline-size: min(100%, 170px); border-radius: 8px; overflow: hidden; color: #fff; margin-inline: auto; }
.player .cap { position: absolute; inset: auto 0 0 0; padding: 18px 8px 8px; font-size: .78rem; background: linear-gradient(to top, rgb(0 0 0 / .75), transparent); }
.player .bar { position: absolute; inset: 0 0 auto 0; display: flex; gap: 2px; padding: 5px; } .player .bar i { flex: 1; block-size: 3px; border-radius: 3px; background: rgb(255 255 255 / .35); } .player .bar i.on { background: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px 6px; display: flex; flex-direction: column; gap: 2px; min-inline-size: 84px; text-align: start; }
.chip .sw { block-size: 26px; border-radius: 4px; } .chip small { font-size: .68rem; color: var(--fg3); } .chip.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); } .chip.off { opacity: .35; }
.card { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-inline-size: 0; }
.big { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; color: var(--fg); }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.namecard { background: #0b1839; color: #fff; border-radius: 4px; padding: 6px 8px; font-size: .8rem; min-inline-size: 110px; text-align: center; line-height: 1.4; }
.bannercrop { background: #fafafa; color: #111; border-radius: 3px; padding: 5px 8px; font-size: .78rem; border: 1px solid #d4d4d4; white-space: nowrap; }
.stock { display: grid; grid-template-columns: 5rem minmax(0, 1fr) 3rem; gap: 8px; align-items: center; font-size: .82rem; }
.stock .track { block-size: 8px; background: var(--subtle); border-radius: 99px; position: relative; } .stock .fill { block-size: 100%; border-radius: 99px; background: var(--fg3); } .stock .fill.low { background: var(--warn); }
.stock .rp { position: absolute; inset-block: -3px; inline-size: 2px; background: var(--fg); }
.faces { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4px; } .faces i { inline-size: 13px; block-size: 13px; border-radius: 50%; background: #f5d0a9; display: block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" dir="rtl" lang="ar">
<header style="display:flex;flex-direction:column;gap:10px">
  <p class="small">مكتبة المرئيات · EMDATRA · عرض عملي للرهانات الثمانية · 10 نوفمبر 2026</p>
  <h1>ثمانية مشاهد من المكتبة</h1>
  <p class="lead">كل مشهد نموذج يعمل بالنقر: الشاشة التي يستعملها صاحبها، ومعها ما يجري خلفها خطوة خطوة. الأسماء والأرقام والصور للعرض، وما قيس فعلًا مكتوب عليه أنه قيس.</p>
</header>
<nav class="rail" id="rail" aria-label="المشاهد"></nav>
<main id="main"></main>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, calm ? 0 : ms));
  const press = (group, btn) => $$('button', group).forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  const mb = (n) => n >= 1000 ? `${(n / 1000).toFixed(1)} GB` : n >= 10 ? `${Math.round(n)} MB` : `${n.toFixed(1)} MB`;
  const SCENES = [
    ['upload', 'الرفع', 'الأثر قبل البايتات'], ['sort', 'الفرز', 'اللافتة تفرز'], ['ledger', 'إعادة الاستفادة', 'دفتر التسليم'], ['hand', 'الوصول', 'اليد'],
    ['cut', 'الإنتاج', 'المونتاج قائمة'], ['named', 'الإنتاج', 'مقاطع بالاسم'], ['heal', 'الإنتاج', 'مخرجات تصحّح نفسها'], ['public', 'الإنتاج', 'نسخة بلا وجوه'],
  ];
  const shell = (id, verb, title, lead, stage, steps, fact) => `<section class="scene" id="sc-${id}" hidden>
    <header><p class="verb">${verb}</p><h2>${title}</h2><p>${lead}</p></header>
    <div class="cols"><div class="stage">${stage}</div>
    <aside class="behind"><h4>خلف الشاشة</h4><ol>${steps.map((s) => `<li>${s}</li>`).join('')}</ol>${fact ? `<p class="fact">${fact}</p>` : ''}</aside></div></section>`;
  const lit = (id, n) => $$(`#sc-${id} .behind li`).forEach((li, i) => li.classList.toggle('on', i < n));

  $('#main').innerHTML = [
    // 1 ── upload
    shell('upload', 'الرفع', 'الأثر قبل البايتات', 'المصوّر يختار ملفات اليوم مرة واحدة. تصل الجهة صفحتها بعد دقيقة، لا بعد ساعة، والأصل يُرفع حين يطلبه أحد.',
      `<div class="row between"><span class="pill acc" id="u-step"></span><button class="btn" id="u-replay" type="button">أعد العرض من البداية</button></div>
       <div style="display:flex;flex-direction:column;gap:6px">
         <div class="meter"><span>الرفع العادي قبل أول رابط</span><div class="track"><div class="fill" style="inline-size:100%"></div></div><b id="u-full"></b></div>
         <div class="meter"><span>الطريق الخفيف حتى الآن</span><div class="track"><div class="fill acc" id="u-bar" style="inline-size:0"></div></div><b id="u-sent"></b></div>
         <p class="small" id="u-time"></p></div>
       <div class="panel"><div class="row between"><h4>هاتف المصوّر · 24 ملفًا</h4><span class="small">انقر ملفًا لطلب أصله</span></div><div class="grid" id="u-grid"></div></div>
       <div class="panel"><div class="row between"><h4>صفحة الجهة</h4><span class="pill" id="u-page-note"></span></div><div class="grid" id="u-page"></div></div>`,
      ['الصفحة تحسب لكل ملف بصمته ووقت لقطته ومصغّرًا صغيرًا، وترسلها كلها. المكتبة ترى اليوم كاملًا «أشباحًا» تُفرز وتُراجَع.',
       'الخادم يطلب عيّنات متوسطة لما يحتاج قراءته: لافتة، وجوه، جودة.',
       'ثم يطلب «نسخ الويب» لما سيظهر في صفحة الجهة فقط. الصفحة تُفتح، وكل صورة معلَّمة «نسخة ويب».',
       'الأصل يُرفع لمن يطلبه: الجهة، أو المحرّر، أو الأرشيف ليلًا. وبعد التحقق من وصوله يظهر على الهاتف «آمن للحذف».'],
      'الأحجام هنا تقديرية للعرض: مصغّر <span class="mono">20 KB</span>، عيّنة <span class="mono">150 KB</span>، نسخة ويب <span class="mono">0.8 MB</span>، أصل صورة <span class="mono">4 MB</span> ومقطع <span class="mono">60 MB</span>. نسبتها الحقيقية تقيسها تجربة «كم بايتًا يكفي؟».'),
    // 2 ── sort
    shell('sort', 'الفرز', 'اللافتة تفرز، والباقي مشترك', 'لا أحد يفرز ملفًا ملفًا. اللافتة تحمل علامتين؛ ما صُوّر بين أول قراءة وآخرها لطلبها، وكل ما عداه ألبوم التوزيع.',
      `<div class="row" style="align-items:flex-start;gap:14px">
         <svg viewBox="0 0 200 70" style="inline-size:min(100%,260px);border:1px solid var(--line);border-radius:4px;background:#fafafa" role="img" aria-label="لافتة تحمل علامتين ورمزًا">
           <g id="s-mark1" transform="translate(6,6)"></g><g id="s-mark2" transform="translate(166,36)"></g>
           <text x="100" y="27" text-anchor="middle" font-size="12" font-weight="600" fill="#111" font-family="IBM Plex Sans Arabic, sans-serif">Ayşe Kaya adına</text>
           <text x="100" y="43" text-anchor="middle" font-size="7.5" fill="#444" font-family="IBM Plex Sans Arabic, sans-serif">Örnek Derneği · Sıcak Yemek</text>
           <text x="42" y="62" font-size="8" fill="#111" font-family="IBM Plex Mono, monospace">K7-4Q2</text></svg>
         <p class="small" style="flex:1;min-inline-size:180px">اللافتة تولّدها المكتبة من سطر الطلب: الاسم كما كتبته الجهة، علامتان في زاويتين يقرؤهما الخادم، ورمز من ستة أحرف يقرؤه الإنسان حتى بعد واتساب.</p></div>

  // ── rail + routing ──
  $('#rail').innerHTML = SCENES.map(([id, verb, name], i) => `<button type="button" data-s="${id}"><small>${i + 1} · ${verb}</small><span>${name}</span></button>`).join('');
  function show(id) {
    if (!SCENES.some((s) => s[0] === id)) id = 'upload';
    SCENES.forEach(([s]) => { $(`#sc-${s}`).hidden = s !== id; });
    $$('#rail button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.s === id)));
  }
  $('#rail').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; show(b.dataset.s); if (location.hash.slice(1) !== b.dataset.s) location.hash = b.dataset.s; });
  addEventListener('hashchange', () => show(location.hash.slice(1)));

  // ── 1 upload ──
  (() => {
    const kinds = Array.from({ length: 24 }, (_, i) => ({ clip: i % 4 === 3, cls: ['s3', 's1', 's1', 's5', 's2', 's4'][i % 6], shown: [0, 2, 5, 8, 9, 13, 16, 20].includes(i), read: i % 3 === 0 || [2, 5, 13].includes(i), tier: 0, orig: false }));
    const size = (f) => (f.clip ? 60 : 4), FULL = kinds.reduce((s, f) => s + size(f), 0);
    let token = 0;
    const sent = () => kinds.reduce((s, f) => s + (f.tier >= 1 ? 0.02 : 0) + (f.tier >= 2 && f.read ? 0.15 : 0) + (f.tier >= 3 && f.shown ? 0.8 : 0) + (f.orig ? size(f) : 0), 0);
    const minutes = (n) => (n === 1 ? 'دقيقة واحدة' : n === 2 ? 'دقيقتان' : n <= 10 ? `${n} دقائق` : `${n} دقيقة`);
    const mins = (m) => { const s = m * 8; return s < 90 ? `${Math.max(1, Math.round(s))} ثانية` : s < 5400 ? minutes(Math.round(s / 60)) : `${(s / 3600).toFixed(1)} ساعة`; };
    function draw(step) {
      $('#u-grid').innerHTML = kinds.map((f, i) => {
        const t = f.orig ? 4 : f.tier >= 3 && f.shown ? 3 : f.tier >= 2 && f.read ? 2 : Math.min(f.tier, 1);
        const tag = ['على الهاتف', 'شبح', 'عيّنة', 'نسخة ويب', 'آمن للحذف'][t];
        return `<button type="button" class="ph ${t ? '' : 'local'} ${f.clip ? 'clip' : ''}" data-i="${i}" aria-label="ملف ${i + 1}: ${tag}">${t ? `<i class="im ${f.cls} ${t === 1 ? 'ghost' : t === 2 ? 'sample' : ''}"></i>` : ''}<span class="l">${tag}</span></button>`;
      }).join('');
      const page = kinds.filter((f) => f.shown && f.tier >= 3);
      $('#u-page').innerHTML = page.length ? page.map((f) => `<div class="ph ${f.cls} ${f.clip ? 'clip' : ''}"><span class="l">${f.orig ? 'الأصل' : 'نسخة ويب'}</span></div>`).join('') : '<p class="small" style="grid-column:1/-1">لم يصل شيء بعد.</p>';
      $('#u-page-note').textContent = page.length ? (page.every((f) => f.orig) ? 'كل الأصول وصلت' : 'نسخ ويب · الأصول لم تصل بعد') : 'فارغة';
      const s = sent();
      $('#u-full').textContent = mb(FULL); $('#u-sent').textContent = mb(s); $('#u-bar').style.inlineSize = `${Math.max(0.6, (s / FULL) * 100)}%`;
      $('#u-time').textContent = `على اتصال 1 ميغابت في الثانية: الرفع العادي ${mins(FULL)}، والطريق الخفيف ${mins(s)} (${((s / FULL) * 100).toFixed(1)}% من البايتات).`;
      $('#u-step').textContent = ['اختيار الملفات', 'البصمات والمصغّرات', 'عيّنات للقراءة', 'نسخ الويب · صفحة الجهة جاهزة', 'صفحة الجهة جاهزة · الأصول عند الطلب'][step]; lit('upload', Math.min(step, 4));
    }
    async function run() {
      const me = ++token; kinds.forEach((f) => { f.tier = 0; f.orig = false; }); draw(0); await wait(700);
      for (const t of [1, 2, 3]) { if (me !== token) return; kinds.forEach((f) => { f.tier = t; }); draw(t); await wait(1100); }

        return `<div class="chip ${out ? 'off' : ''}" style="${hit ? 'border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)' : ''}"><div class="sw ${cls}" style="block-size:44px;position:relative"><span class="faces">${'<i></i>'.repeat(hit ? 1 : n)}</span></div><small>${name}</small><small>${hit ? 'الكاشف قال صفر' : n ? `${n} وجوه` : 'بلا وجوه'}</small></div>`; }).join('');
      const used = SEG.filter((s) => mode === 'funder' || s[2] === 0).length, m = $('#p-msg');
      if (mode === 'funder') { m.className = 'msg info'; m.textContent = `نسخة الجهة: كل القطع العشر، ${used * 4} ثانية. للجهة أن تنشر منها ما يسمح به حقّ الاستعمال.`; lit('public', 1); }
      else if (miss) { m.className = 'msg bad'; m.textContent = 'فشل البناء. الفحص الثاني وجد وجهًا في قطعة «ظهور» التي عدّها الكاشف صفرًا. لا ملف يخرج، والقطعة تُعلَّم لإنسان.'; lit('public', 3); }
      else { m.className = 'msg ok'; m.textContent = `النسخة العلنية: ${used} قطع، ${used * 4} ثانية. الفحص الثاني للملف النهائي: صفر وجوه. تنتظر نظرة إنسان ثم تُطلق.`; lit('public', 4); }
    }
    $('#p-mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; press(b.parentElement, b); mode = b.dataset.m; draw(); });
    $('#p-miss').addEventListener('click', (e) => { miss = !miss; e.target.textContent = miss ? 'أعد الكاشف سليمًا' : 'جرّب: وجه فات الكاشف'; mode = 'public'; press($('#p-mode'), $('#p-mode [data-m="public"]')); draw(); });
    draw();
  })();

  show(location.hash.slice(1) || 'upload');
})();
</script>

</body>
</html>
