# =============================================================================
# مكتبة المرئيات — media.emdatra.org
#
# ثلاث حاويات معزولة عن بقية المواقع، لا تشترك معها إلا في Caddy (شبكة deploy_default):
#   media-db      Postgres 16 خاصّة بالمكتبة، بلا منفذ مكشوف
#   media-app     الخادم (Next.js) — Caddy يصله باسم media-app:3000
#   media-worker  المعالجة (ffmpeg/sharp/exiftool) — لا يصله أحد من الخارج
#
# الملفات نفسها لا تعيش هنا بل في R2؛ القاعدة وحدها على القرص.
# الأسرار في /opt/sites/media/.env (600) — لا في المستودع ولا في هذا الملف.
#
# ⚠️ الخادم مشترك وذاكرته ضيّقة: الحدود أدناه مقصودة، والعامل يرمّز ملفاً واحداً في
#    كل مرة. لا ترفعها قبل قياس MemAvailable على الخادم.
#
#   docker compose -p media -f docker-compose.yml --env-file /opt/sites/media/.env up -d --build
# =============================================================================

name: media

x-env: &env
  TZ: Asia/Hebron
  DATABASE_URL: postgres://media:${DB_PASSWORD:?set DB_PASSWORD}@media-db:5432/media
  APP_ORIGIN: ${APP_ORIGIN:-https://media.emdatra.org}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  LINK_SIGNING_SECRET: ${LINK_SIGNING_SECRET:?set LINK_SIGNING_SECRET}
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT (R2 S3 API endpoint)}
  S3_REGION: auto
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_PREFIX: ${S3_PREFIX:-media-library/}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  media-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: media
      TZ: Asia/Hebron
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - /srv/sites/data/media/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    networks: [internal]

  media-app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: app
    image: media-app:latest
    restart: unless-stopped
    depends_on:
      media-db:
        condition: service_healthy
    environment:
      <<: *env
      DB_POOL: "8"
    mem_limit: 384m
    networks:
      internal: {}
      web:
        aliases: [media-app]

  media-worker:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
      target: worker
    image: media-worker:latest
    restart: unless-stopped
    depends_on:
      media-db:
        condition: service_healthy
    environment:
      <<: *env
      DB_POOL: "4"
      WORKER_CONCURRENCY: "1"
    # ffmpeg بلا حدود يأخذ المعالج كله من بقية المواقع
    cpus: 1.5
    mem_limit: 1g
    tmpfs:
      - /tmp:size=2g
    networks: [internal]

networks:
  internal: {}
  web:
    name: deploy_default
    external: true
