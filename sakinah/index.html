<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سكينة — مواقيت الصلاة والقبلة والأذكار</title>
  <meta name="description" content="تطبيق إسلامي دقيق: مواقيت الصلاة حسب موقعك، المصحف مع التلاوة ومراجعة الحفظ، اتجاه القبلة بدقة عالية، أذكار الصباح والمساء، أحاديث مختارة من الصحيحين، وتذكير بمواعيد الصلاة.">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سكينة">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <!-- سياسة أمان المحتوى: لا شيفرة مضمّنة، والأصول الخارجية محصورة في خطوط المصحف (jsDelivr) والتفاسير (quran.com) والتلاوات (Islamic Network) وتسمية المدينة (BigDataCloud، اختياري) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://api.quran.com https://cdn.jsdelivr.net https://cdn.islamic.network https://verses.quran.com https://api.bigdatacloud.net; media-src 'self' blob: https://cdn.islamic.network https://verses.quran.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- خطوط الواجهة مستضافة محليًا (لا طلبات إلى Google Fonts) وتُعرض بخطوط النظام ريثما تُحمَّل -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/boot-theme.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-1.2 2.2-2 3.6-2 5.5a2 2 0 0 0 4 0c0-1.9-.8-3.3-2-5.5Z"/><path d="M4 20v-6a8 8 0 0 1 16 0v6"/><path d="M2 20h20"/><path d="M9 20v-3a3 3 0 0 1 6 0v3"/></svg>
        </div>
        <div>
          <h1>سكينة</h1>
          <small id="header-sub">رفيقك للصلاة والذكر</small>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-settings" aria-label="الإعدادات" title="الإعدادات"></button>
        <button class="icon-btn" id="btn-theme" aria-label="تبديل السمة" title="السمة"></button>
        <button class="icon-btn" id="btn-install" aria-label="تثبيت التطبيق" title="تثبيت التطبيق" hidden></button>
      </div>
    </header>

    <main class="view-container" id="views">
      <section class="view" id="view-prayer" aria-labelledby="tab-prayer"></section>
      <section class="view" id="view-quran" aria-labelledby="tab-quran"></section>
      <section class="view" id="view-qibla" aria-labelledby="tab-qibla"></section>
      <section class="view" id="view-adhkar" aria-labelledby="tab-adhkar"></section>
      <section class="view" id="view-more" aria-labelledby="tab-more"></section>
      <section class="view" id="view-hadith" aria-label="الأحاديث"></section>
      <section class="view" id="view-settings" aria-label="الإعدادات"></section>
    </main>

    <nav class="tabbar" aria-label="التنقل الرئيسي">
      <button class="tab" id="tab-prayer" data-view="prayer"></button>
      <button class="tab" id="tab-quran" data-view="quran"></button>
      <button class="tab" id="tab-qibla" data-view="qibla"></button>
      <button class="tab" id="tab-adhkar" data-view="adhkar"></button>
      <button class="tab" id="tab-more" data-view="more"></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h3 id="sheet-title"></h3><button class="icon-btn" id="sheet-close" aria-label="إغلاق"></button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:20px;text-align:center">يلزم تفعيل JavaScript لتشغيل التطبيق.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
